name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    # Apple silicon, macOS 27, Xcode 27. The package targets macOS 15.5, so
    # availability mistakes fail the build here too.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The suites tagged `.quic`: real QUIC sessions on loopback, run in
      # real time. SwiftPM runs test binaries in parallel, and alongside the
      # heavy engine tests a hosted VM starves them (a burst arriving 94 %
      # whole, a session not converging in 25 s), so they get a step of
      # their own. A new real-network suite belongs here too.
      QUIC_SUITES: AgentDriverTests|QUICBurstTests|QUICLifecycleTests|QUICLoopbackTests|QUICSustainedSessionTests|SignInQUICTests|ViewerAuthTests
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Version
        run: scripts/check-version
      - name: Rust
        # The AV1 CPU code is Rust (rust/av1); the package links its static
        # library, arm64 + x86_64.
        run: scripts/build-rust --universal
      - name: Rust tests
        run: cargo test --release --manifest-path rust/av1/Cargo.toml
      - name: Build
        run: swift build --build-tests
      - name: Test
        # VideoSendGateTests emulates a 3 Mbit/s link through a loopback relay
        # and first checks the rig reproduces the byte-gate baseline's seconds
        # of lag. Hosted VMs can't drive the relay hard enough for that
        # (byte-gate p95 ~400 ms instead of > 1 s), so it only runs locally
        # (`just test`).
        run: swift test --skip "VideoSendGateTests|$QUIC_SUITES"
      - name: Real-QUIC tests
        # One suite at a time: run side by side, the suites still starved each
        # other on a hosted VM (QUICSustainedSessionTests' 2048×2048 session
        # missing its 25 s round with its control path alive, 2026-10-26).
        # ~100 s instead of ~45 s.
        run: swift test --filter "$QUIC_SUITES" --no-parallel

  apps:
    name: Apps
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build Host
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme Host
          -configuration Debug -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build Viewer
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme Viewer
          -configuration Debug -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build the iPad Viewer
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme iPad
          -configuration Debug -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build the viewer package for iPadOS
        # The package targets iPadOS 27 too (the iPad Viewer), so
        # availability mistakes and Mac-only APIs outside `#if os(macOS)`
        # fail here.
        run: >
          xcodebuild -scheme GlassActViewer -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build

  intel:
    name: Intel
    # Builds for Intel Macs (x86_64) from the same Apple-silicon runner:
    # hosted Intel runners stop at macOS 15, which can't run Xcode 27, so
    # the tests themselves run on Intel only on real hardware.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        # The AV1 CPU code is Rust (rust/av1); the package links its static
        # library, arm64 + x86_64.
        run: scripts/build-rust --universal
      - name: Build package and tests (x86_64)
        run: swift build --arch x86_64 --build-tests
      - name: Build Host (universal Release)
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme Host
          -configuration Release -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build Viewer (universal Release)
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme Viewer
          -configuration Release -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build

  allocations:
    name: Allocations
    # The no-allocation hot-path tests (INV-7) assert their counts only in
    # optimized code: in a debug build the stdlib's own hashing allocates
    # per row and buries the engine's numbers. So they get a release build
    # of their own (`just test-alloc`).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        # The AV1 CPU code is Rust (rust/av1); the package links its static
        # library, arm64 + x86_64.
        run: scripts/build-rust --universal
      - name: Allocation-count tests (release)
        run: swift test -c release --filter ScrollAllocationTests

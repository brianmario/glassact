name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    # macOS 27 on Apple Silicon with Xcode 27 (the package's floor).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  apps:
    name: Apps
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build Host
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme Host
          -configuration Debug -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build Viewer
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme Viewer
          -configuration Debug -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build

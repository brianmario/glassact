name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    # Apple silicon, macOS 27, Xcode 27. The package targets macOS 15.5, so
    # availability mistakes fail the build here too.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The suites tagged `.quic`: real QUIC sessions on loopback, run in
      # real time. SwiftPM runs test binaries in parallel, and alongside the
      # heavy engine tests a hosted VM starves them (a burst arriving 94 %
      # whole, a session not converging in 25 s), so they get a step of
      # their own. A new real-network suite belongs here too.
      # (AV1SessionQUICTests needs Glass Act's AV1 encoder, a real Apple-silicon GPU: it skips
      # itself on a hosted runner's paravirtual one.)
      QUIC_SUITES: AV1SessionQUICTests|AgentDriverTests|QUICBurstTests|QUICLifecycleTests|QUICLoopbackTests|QUICSustainedSessionTests|SignInQUICTests|ViewerAuthTests
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
        with:
          job: tests
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Version
        run: scripts/check-version
      - name: Rust
        # The AV1 CPU code is Rust (rust/av1); the package links its static
        # library, arm64 + x86_64.
        run: scripts/build-rust --universal
      - name: Build
        # Release: the engine's session simulations (a virtual network for
        # many simulated seconds: bandwidth adaptation, handoffs, faults) run
        # ~14× faster optimized. Serial on an M4 Pro the suite took 923 s in
        # debug, 150 s in release, and on a slow hosted runner the debug job
        # hit its 30 minutes with every test passed (2026-11-21). The code
        # keeps its checks in -O (preconditions, overflow traps, checked wire
        # parsing; the one `assert` is in GPU code CI skips), and allocation
        # counts are asserted only optimized. `just test` stays debug.
        #
        # The build is `swift test`'s own, stopped before any test runs (its
        # list of them): `swift build -c release --build-tests` doesn't build
        # release modules for testing, so every `@testable import` fails
        # ("unable to resolve Swift module dependency to a compatible
        # module"), and only `swift test` has the setting that does
        # (--enable-testable-imports, its default). The two steps below then
        # find their build done.
        run: swift test -c release list
      - name: Test
        # VideoSendGateTests emulates a 3 Mbit/s link through a loopback relay
        # and first checks the rig reproduces the byte-gate baseline's seconds
        # of lag. Hosted VMs can't drive the relay hard enough for that
        # (byte-gate p95 ~400 ms instead of > 1 s), so it only runs locally
        # (`just test`).
        # The AV1 encoder's GPU suites (GlassActAV1Tests) skip themselves here: a hosted runner is a
        # VM whose paravirtual GPU doesn't compile or run the kernels exactly
        # (AV1ShaderSource.hasCapableGPU). Their CPU half runs: the Rust tests above and the libaom
        # decode gates (AV1CoreTests).
        run: swift test -c release --skip "VideoSendGateTests|$QUIC_SUITES"
      - name: Real-QUIC tests
        # One suite at a time: run side by side, the suites still starved each
        # other on a hosted VM (QUICSustainedSessionTests' 2048×2048 session
        # missing its 25 s round with its control path alive, 2026-10-26).
        # ~100 s instead of ~45 s.
        run: swift test -c release --filter "$QUIC_SUITES" --no-parallel

  apps:
    name: Apps
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
        with:
          job: apps
      - id: xcode-cache
        uses: ./.github/actions/xcode-cache
        with:
          job: apps
      - name: Rust targets
        # Each app target runs scripts/build-rust --xcode, which builds the Rust AV1 library
        # (rust/av1) for the platform and architectures Xcode asks for: the Mac apps link it
        # universal, the iPad app for iPadOS (and the Simulator). The script adds a missing
        # target itself; adding them here keeps that out of the build's time and log.
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - name: Metal toolchain
        # The Host's build compiles the AV1 kernels offline as a check (scripts/build-rust --xcode
        # --shaders), so a kernel that doesn't compile fails here; without the toolchain it only
        # warns. The GPU tests, which compile them at run time, don't run on CI's VMs.
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Build Host
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme Host
          -configuration Debug -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES build
      - name: Build Viewer
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme Viewer
          -configuration Debug -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES build
      - name: Build the iPad Viewer
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme iPad
          -configuration Debug -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES build
      - name: Build the viewer package for iPadOS
        # The package targets iPadOS 27 too (the iPad Viewer), so
        # availability mistakes and Mac-only APIs outside `#if os(macOS)`
        # fail here. (A library product: nothing links the Rust library.)
        run: >
          xcodebuild -scheme GlassActViewer -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES build
      - name: Save the compilation cache
        # On main only (see the action). Pull requests restore main's.
        if: github.event_name == 'push'
        uses: ./.github/actions/xcode-cache/save
        with:
          key: ${{ steps.xcode-cache.outputs.key }}

  intel:
    name: Intel
    # Builds for Intel Macs (x86_64) from the same Apple-silicon runner:
    # hosted Intel runners stop at macOS 15, which can't run Xcode 27, so
    # the tests themselves run on Intel only on real hardware.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
        with:
          job: intel
      - id: xcode-cache
        uses: ./.github/actions/xcode-cache
        with:
          job: intel
      - name: Rust
        # The AV1 CPU code is Rust (rust/av1); the package links its static
        # library, arm64 + x86_64.
        run: scripts/build-rust --universal
      - name: Build package and tests (x86_64)
        run: swift build --arch x86_64 --build-tests
      # (The apps' Xcode targets build the Rust library universal themselves.)
      - name: Build Host (universal Release)
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme Host
          -configuration Release -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES build
      - name: Build Viewer (universal Release)
        run: >
          xcodebuild -project Apps/GlassActApps.xcodeproj -scheme Viewer
          -configuration Release -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES build
      - name: Save the compilation cache
        # On main only (see the action). Pull requests restore main's.
        if: github.event_name == 'push'
        uses: ./.github/actions/xcode-cache/save
        with:
          key: ${{ steps.xcode-cache.outputs.key }}

  rust:
    name: Rust
    # The Rust AV1 crate's tests (rust/av1), on a runner of their own beside
    # the Tests job: in it they took 3–5 minutes on the critical path. This
    # job replaced "Allocations" (2026-11-21): its allocation-count tests
    # (INV-7, counts asserted only in optimized code) now run in the Tests
    # job's release build.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
        with:
          job: rust
      - name: Rust tests
        run: cargo test --release --manifest-path rust/av1/Cargo.toml

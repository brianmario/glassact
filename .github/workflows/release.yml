name: Release

# A tag vX.Y.Z builds both apps and the glassact CLI, signs them with
# Developer ID, notarizes them, and attaches them to a draft GitHub release
# for review. RELEASING.md has the one-time setup (secrets) and the steps.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the draft release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      TEAM: ${{ vars.APPLE_TEAM_ID }}
      HOST_PROFILE: ${{ vars.HOST_PROFILE_NAME }}
      VIEWER_PROFILE: ${{ vars.VIEWER_PROFILE_NAME }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      OUT: build/ci-release
    steps:
      - uses: actions/checkout@v7

      - name: Version matches the tag
        run: scripts/check-version "$TAG"

      - name: Secrets present
        env:
          CERT: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          HOST_PROFILE_DATA: ${{ secrets.HOST_PROFILE_BASE64 }}
          VIEWER_PROFILE_DATA: ${{ secrets.VIEWER_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=()
          # ASC_ISSUER_ID is only for a team API key; an individual key has none.
          for name in TEAM HOST_PROFILE VIEWER_PROFILE ASC_KEY_ID CERT CERT_PASSWORD \
                      HOST_PROFILE_DATA VIEWER_PROFILE_DATA ASC_KEY SPARKLE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::release setup incomplete (RELEASING.md): ${missing[*]}"
            exit 1
          fi

      - name: Signing keychain and profiles
        env:
          # A step's env, not the job's: the job's can't read `runner`.
          KEYCHAIN: ${{ runner.temp }}/release.keychain-db
          CERT: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          HOST_PROFILE_DATA: ${{ secrets.HOST_PROFILE_BASE64 }}
          VIEWER_PROFILE_DATA: ${{ secrets.VIEWER_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          PROFILES="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES"
          for data in "$HOST_PROFILE_DATA" "$VIEWER_PROFILE_DATA"; do
            echo "$data" | base64 --decode > "$RUNNER_TEMP/p.provisionprofile"
            uuid=$(security cms -D -i "$RUNNER_TEMP/p.provisionprofile" | plutil -extract UUID raw -o - -)
            mv "$RUNNER_TEMP/p.provisionprofile" "$PROFILES/$uuid.provisionprofile"
          done
          echo "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle.key"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        run: Apps/ci-release.sh

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Glass Act ${TAG#v}" \
            --notes "Built by the Release workflow from $GITHUB_SHA. Edit these notes before publishing." \
            Apps/$OUT/dist/*

      - name: Clean up
        if: always()
        env:
          KEYCHAIN: ${{ runner.temp }}/release.keychain-db
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/sparkle.key"
